name: 自动更新目录索引并部署

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/index.json"
  workflow_dispatch: # 允许手动触发

# 设置权限
permissions:
  contents: write
  pages: write
  id-token: write

# 只允许一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 生成索引
        run: |
          python scripts/generate_index.py

      - name: 检查是否有变化
        id: check_changes
        run: |
          git diff --exit-code README.md docs/index.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 提交更改
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md docs/index.json
          git commit -m "🤖 自动更新目录索引"
          git push

      - name: 重新检出代码（包含最新提交）
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
